spring:
  application:
    name: SmartHR Assistant

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          # 0.0 = precise/deterministic, 1.0 = creative
          temperature: 0.3
          # Default max tokens — per-request endpoints override this
          num-predict: 500

server:
  port: 8080
