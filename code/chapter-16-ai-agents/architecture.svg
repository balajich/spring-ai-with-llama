<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 580 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', system-ui, sans-serif">
  <title>Chapter 16 — An AI agent planning and chaining tool calls</title>
  <desc>A goal goes in; the agent loops Reason-Act-Observe, calling five HR tools in an order it chooses, then writes the report.</desc>
  <rect width="580" height="320" fill="#f8f9fa" rx="12"/>

  <rect x="20" y="120" width="112" height="80" rx="10" fill="white" stroke="#b0568c" stroke-width="2"/>
  <text x="76" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#7d2a5c">GOAL</text>
  <text x="76" y="167" text-anchor="middle" font-size="10" fill="#555">"HR report</text>
  <text x="76" y="181" text-anchor="middle" font-size="10" fill="#555">for 2025-05"</text>

  <rect x="168" y="80" width="176" height="160" rx="10" fill="white" stroke="#e67e22" stroke-width="2"/>
  <text x="256" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3b00">Agent loop</text>
  <text x="256" y="123" text-anchor="middle" font-size="9" fill="#999">Spring AI runs this</text>
  <rect x="186" y="134" width="140" height="24" rx="6" fill="#fdf1e3" stroke="#e67e22" stroke-width="1.2"/>
  <text x="256" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#7a3b00">REASON</text>
  <rect x="186" y="164" width="140" height="24" rx="6" fill="#fdf1e3" stroke="#e67e22" stroke-width="1.2"/>
  <text x="256" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#7a3b00">ACT (call a tool)</text>
  <rect x="186" y="194" width="140" height="24" rx="6" fill="#fdf1e3" stroke="#e67e22" stroke-width="1.2"/>
  <text x="256" y="210" text-anchor="middle" font-size="10" font-weight="700" fill="#7a3b00">OBSERVE</text>
  <path d="M 330 206 C 348 206 348 146 332 146" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a16a)"/>
  <text x="360" y="176" text-anchor="middle" font-size="9" fill="#7a3b00">repeat</text>

  <rect x="392" y="60" width="168" height="200" rx="10" fill="white" stroke="#5b6abf" stroke-width="2"/>
  <text x="476" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3494">@Tool methods</text>
  <text x="476" y="100" text-anchor="middle" font-size="9" fill="#999">the agent picks the order</text>
  <rect x="406" y="110" width="140" height="22" rx="5" fill="#eef0ff" stroke="#5b6abf" stroke-width="1"/>
  <text x="476" y="125" text-anchor="middle" font-size="9" font-weight="700" fill="#2d3494">getHeadcount</text>
  <rect x="406" y="138" width="140" height="22" rx="5" fill="#eef0ff" stroke="#5b6abf" stroke-width="1"/>
  <text x="476" y="153" text-anchor="middle" font-size="9" font-weight="700" fill="#2d3494">getOpenPositions</text>
  <rect x="406" y="166" width="140" height="22" rx="5" fill="#eef0ff" stroke="#5b6abf" stroke-width="1"/>
  <text x="476" y="181" text-anchor="middle" font-size="9" font-weight="700" fill="#2d3494">getRecentHires</text>
  <rect x="406" y="194" width="140" height="22" rx="5" fill="#eef0ff" stroke="#5b6abf" stroke-width="1"/>
  <text x="476" y="209" text-anchor="middle" font-size="9" font-weight="700" fill="#2d3494">getAttrition</text>
  <rect x="406" y="222" width="140" height="22" rx="5" fill="#eef0ff" stroke="#5b6abf" stroke-width="1"/>
  <text x="476" y="237" text-anchor="middle" font-size="9" font-weight="700" fill="#2d3494">getPolicyUpdates</text>

  <path d="M 132 160 L 168 160" fill="none" stroke="#b0568c" stroke-width="1.8" marker-end="url(#a16b)"/>
  <path d="M 344 140 L 392 130" fill="none" stroke="#5b6abf" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#a16c)"/>
  <path d="M 392 200 L 344 190" fill="none" stroke="#5b6abf" stroke-width="1.8" marker-end="url(#a16c)"/>

  <rect x="168" y="266" width="176" height="34" rx="8" fill="#e8f5e9" stroke="#5aaa6b" stroke-width="1.5"/>
  <text x="256" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#1b6b2f">Report + tool trace</text>
  <path d="M 256 240 L 256 266" fill="none" stroke="#5aaa6b" stroke-width="1.8" marker-end="url(#a16d)"/>

  <text x="290" y="315" text-anchor="middle" font-size="9" fill="#aaa">you provide the tools — the model decides the plan</text>

  <defs>
    <marker id="a16a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e67e22"/></marker>
    <marker id="a16b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b0568c"/></marker>
    <marker id="a16c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5b6abf"/></marker>
    <marker id="a16d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5aaa6b"/></marker>
  </defs>
</svg>
