---
title: "Spring AI with Llama"
subtitle: "A Practical Guide to Building AI-Powered Java Applications"
author: "Your Name"
date: "2025"
lang: en-US

# Document class
documentclass: book
classoption:
  - oneside
  - openany

# Typography
fontsize: 11pt
linestretch: 1.4
mainfont: "Georgia"
monofont: "Courier New"
monofontoptions:
  - Scale=0.85

# Page layout
geometry:
  - top=1in
  - bottom=1in
  - left=1.25in
  - right=1in

# Table of contents
toc: true
toc-depth: 2
numbersections: false

# Links and colours
colorlinks: true
linkcolor: "NavyBlue"
urlcolor: "NavyBlue"
toccolor: "black"

# Code highlighting
highlight-style: tango

# LaTeX header — page style, chapter formatting, code block borders
header-includes:
  - |
    \usepackage{fancyhdr}
    \usepackage{xcolor}
    \usepackage{mdframed}
    \usepackage{titlesec}
    \pagestyle{fancy}
    \fancyhf{}
    \fancyhead[L]{\small\textit{Spring AI with Llama}}
    \fancyhead[R]{\small\thepage}
    \fancyfoot[C]{\small\textit{A Practical Guide}}
    \renewcommand{\headrulewidth}{0.4pt}
    \renewcommand{\footrulewidth}{0.4pt}
    \definecolor{codebg}{HTML}{F5F5F5}
    \definecolor{codeborder}{HTML}{DDDDDD}
    \surroundwithmdframed[
      backgroundcolor=codebg,
      linecolor=codeborder,
      linewidth=0.5pt,
      innerleftmargin=8pt,
      innerrightmargin=8pt,
      innertopmargin=6pt,
      innerbottommargin=6pt,
      skipabove=6pt,
      skipbelow=6pt
    ]{verbatim}
    \titleformat{\chapter}[display]
      {\normalfont\huge\bfseries}
      {\chaptertitlename\ \thechapter}{20pt}{\Huge}
    \titlespacing*{\chapter}{0pt}{30pt}{20pt}
